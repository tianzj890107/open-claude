<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open Claude · Agent</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" />
<style>
/* Fallback design tokens so the original styles render in a plain browser */
:root{
  --color-background-primary:#ffffff;
  --color-background-secondary:#f7f7f8;
  --color-background-tertiary:#ececf1;
  --color-border-tertiary:#e7e7ea;
  --color-border-secondary:#d9d9e3;
  --color-border-info:#8b5cf6;
  --color-text-primary:#1f2023;
  --color-text-secondary:#62636d;
  --color-text-tertiary:#9a9ba6;
  --border-radius-lg:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --color-background-primary:#1c1c1f;
    --color-background-secondary:#26262b;
    --color-background-tertiary:#33333a;
    --color-border-tertiary:#3a3a42;
    --color-border-secondary:#45454f;
    --color-border-info:#8b5cf6;
    --color-text-primary:#ececf1;
    --color-text-secondary:#b3b4bd;
    --color-text-tertiary:#83848f;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--color-background-primary);color:var(--color-text-primary);}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}
.aiapp{display:flex;height:100vh;border:0.5px solid var(--color-border-tertiary);overflow:hidden;background:var(--color-background-primary);}
.side{width:214px;flex-shrink:0;background:var(--color-background-secondary);border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;padding:12px 10px;gap:5px;}
.sbrand{display:flex;align-items:center;gap:9px;padding:4px 6px 10px;}
.bmark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(99,102,241,.35);}
.newchat{display:flex;align-items:center;gap:8px;width:100%;padding:9px 11px;border:0.5px solid var(--color-border-secondary);border-radius:11px;background:var(--color-background-primary);color:var(--color-text-primary);font-size:13px;cursor:pointer;transition:background .15s,border-color .15s;}
.newchat:hover{background:var(--color-background-tertiary);border-color:var(--color-border-info);}
.srow{display:flex;align-items:center;gap:8px;width:100%;padding:8px 11px;border:none;border-radius:11px;background:transparent;color:var(--color-text-secondary);font-size:13px;cursor:pointer;transition:background .15s;}
.srow:hover{background:var(--color-background-tertiary);}
.seclabel{font-size:11px;color:var(--color-text-tertiary);padding:12px 11px 4px;}
.citem{display:block;width:100%;text-align:left;padding:7px 11px;border:none;border-radius:9px;background:transparent;color:var(--color-text-primary);font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s;}
.citem:hover{background:var(--color-background-tertiary);}
.citem.on{background:var(--color-background-tertiary);}
.userrow{margin-top:auto;display:flex;align-items:center;gap:9px;padding:8px 8px;border-radius:11px;cursor:pointer;transition:background .15s;}
.userrow:hover{background:var(--color-background-tertiary);}
/* scrollable nav area + collapsible category groups */
.snav{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.navgroup{display:flex;align-items:center;gap:8px;width:100%;padding:8px 11px;border:none;border-radius:11px;background:transparent;color:var(--color-text-secondary);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s;}
.navgroup:hover{background:var(--color-background-tertiary);}
.navgroup .chev{margin-left:auto;font-size:15px;transition:transform .15s;color:var(--color-text-tertiary);}
.navgroup.open .chev{transform:rotate(180deg);}
.navsub{display:none;flex-direction:column;gap:2px;padding:2px 0 4px;}
.navsub.open{display:flex;}
.subitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 11px 6px 26px;border:none;border-radius:9px;background:transparent;color:var(--color-text-primary);font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s;}
.subitem:hover{background:var(--color-background-tertiary);}
.subitem i{font-size:15px;color:var(--color-text-tertiary);flex-shrink:0;}
/* placeholder modal for a settings/log panel */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;}
.modal-mask.show{display:flex;}
.modal{width:min(560px,92vw);max-height:80vh;overflow:auto;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:14px;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.25);}
.modal .mhead{display:flex;align-items:flex-start;gap:10px;}
.modal .micon{width:34px;height:34px;border-radius:10px;background:var(--color-background-tertiary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.modal h3{margin:0;font-size:16px;color:var(--color-text-primary);}
.modal .mcat{font-size:12px;color:var(--color-text-tertiary);margin-top:2px;}
.modal .mbody{margin-top:14px;font-size:13px;color:var(--color-text-secondary);line-height:1.65;}
.modal .mnote{margin-top:14px;font-size:12px;color:var(--color-text-tertiary);background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:9px;padding:9px 11px;}
.modal .mclose{margin-top:16px;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:0.5px solid var(--color-border-secondary);border-radius:10px;background:var(--color-background-primary);color:var(--color-text-primary);font-size:13px;cursor:pointer;}
.modal .mclose:hover{background:var(--color-background-tertiary);}
/* model selector inside the 模型参数 panel */
.modellist{display:flex;flex-direction:column;gap:5px;}
.modelopt{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 11px;border:0.5px solid var(--color-border-tertiary);border-radius:10px;background:var(--color-background-primary);color:var(--color-text-primary);font-size:13px;cursor:pointer;transition:background .15s,border-color .15s;}
.modelopt:hover{background:var(--color-background-tertiary);}
.modelopt.on{border-color:var(--color-border-info);background:var(--color-background-secondary);}
.modelopt i{font-size:17px;color:var(--color-text-tertiary);flex-shrink:0;}
.modelopt.on i{color:#6366f1;}
.modelopt .mid{margin-left:auto;font-size:11px;color:var(--color-text-tertiary);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
/* inference-parameter controls */
.phead{font-size:12px;font-weight:600;color:var(--color-text-secondary);margin:18px 0 4px;}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:0.5px solid var(--color-border-tertiary);}
.prow label{flex:1;font-size:13px;color:var(--color-text-primary);}
.prow .hint{display:block;font-size:11px;color:var(--color-text-tertiary);margin-top:1px;font-weight:400;}
.prow input[type=number]{width:118px;padding:6px 9px;border:0.5px solid var(--color-border-secondary);border-radius:8px;background:var(--color-background-primary);color:var(--color-text-primary);font-size:13px;}
.prow input[type=range]{width:130px;}
.pinline{display:flex;align-items:center;gap:8px;}
.pinline span{font-size:12px;color:var(--color-text-tertiary);min-width:40px;text-align:right;}
.prow.disabled{opacity:.4;pointer-events:none;}
.sw{position:relative;width:38px;height:22px;flex-shrink:0;}
.sw input{opacity:0;width:0;height:0;}
.sw .sl{position:absolute;inset:0;border-radius:22px;background:var(--color-border-secondary);transition:background .15s;cursor:pointer;}
.sw .sl:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:transform .15s;}
.sw input:checked + .sl{background:#6366f1;}
.sw input:checked + .sl:before{transform:translateX(16px);}
.pnote{margin-top:10px;font-size:12px;color:var(--color-text-tertiary);}
.uav{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#10b981,#06b6d4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:500;flex-shrink:0;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;gap:6px;padding:11px 16px;border-bottom:0.5px solid var(--color-border-tertiary);position:relative;}
.modelpill{display:flex;align-items:center;gap:6px;padding:6px 11px;border:none;border-radius:10px;background:transparent;color:var(--color-text-primary);font-size:14px;font-weight:500;cursor:pointer;transition:background .15s;}
.modelpill:hover{background:var(--color-background-secondary);}
.ibtn{width:32px;height:32px;border-radius:9px;border:none;background:transparent;color:var(--color-text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.ibtn:hover{background:var(--color-background-secondary);color:var(--color-text-primary);}
.thread{flex:1;overflow-y:auto;padding:20px 16px;}
.tinner{max-width:640px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px;}
.ubub{align-self:flex-end;max-width:80%;background:var(--color-background-secondary);padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.amsg{display:flex;gap:11px;}
.aav{width:28px;height:28px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px rgba(99,102,241,.3);}
.atxt{font-size:14px;line-height:1.7;color:var(--color-text-primary);white-space:pre-wrap;word-break:break-word;}
.atxt.rendered{white-space:normal;}
.atxt.rendered p{margin:0 0 10px;}
.atxt.rendered pre{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:10px;padding:11px 13px;overflow:auto;font-size:12.5px;line-height:1.55;}
.atxt.rendered code{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;}
.atxt.rendered :not(pre)>code{background:var(--color-background-tertiary);border-radius:5px;padding:1px 5px;font-size:12.5px;}
/* tool call card (reuses the original .art artifact-card styling) */
.art{display:flex;align-items:center;gap:11px;border:0.5px solid var(--color-border-secondary);border-radius:13px;padding:11px 12px;background:var(--color-background-primary);transition:border-color .15s;width:100%;text-align:left;margin-top:10px;max-width:460px;}
.atile{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--color-background-tertiary);}
.tool-result{max-width:460px;margin:6px 0 0;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.5;color:var(--color-text-secondary);white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto;font-family:"SFMono-Regular",Consolas,monospace;}
.tool-result.err{color:#dc2626;border-color:#f3b4b4;}
.err-line{color:#dc2626;font-size:13px;margin-top:8px;}
.spin{animation:spin 1s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--color-text-tertiary);gap:10px;text-align:center;}
.composer{padding:6px 16px 14px;}
.cinner{max-width:640px;margin:0 auto;width:100%;}
.inputbox{display:flex;align-items:center;gap:8px;border:0.5px solid var(--color-border-secondary);border-radius:16px;padding:9px 10px 9px 13px;background:var(--color-background-secondary);transition:border-color .15s,box-shadow .15s;}
.inputbox:focus-within{border-color:var(--color-border-info);box-shadow:0 0 0 3px rgba(99,102,241,.12);}
.send{width:34px;height:34px;border-radius:11px;border:none;cursor:pointer;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(99,102,241,.3);}
.send:hover{filter:brightness(1.06);}
.send:disabled{opacity:.5;cursor:default;}
.disc{text-align:center;font-size:11px;color:var(--color-text-tertiary);margin-top:9px;}
/* popovers */
.pop{position:absolute;z-index:20;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.16);padding:6px;min-width:200px;max-height:340px;overflow:auto;}
.popitem{display:block;width:100%;text-align:left;padding:8px 10px;border:none;border-radius:8px;background:transparent;color:var(--color-text-primary);font-size:13px;cursor:pointer;}
.popitem:hover{background:var(--color-background-tertiary);}
.popitem .d{font-size:11px;color:var(--color-text-tertiary);margin-top:2px;white-space:normal;}
.cap-h{font-size:11px;color:var(--color-text-tertiary);padding:8px 10px 4px;font-weight:600;}
.hidden{display:none;}
</style>
</head>
<body>
<h2 class="sr-only">Open Claude Agent 对话界面：实时驱动命令行 Agent 的全部能力（Bash、文件读写、搜索、技能、子代理、MCP）</h2>

<div class="aiapp">
  <div class="side">
    <div class="sbrand">
      <div class="bmark"><i class="ti ti-sparkles" style="font-size:16px;color:#fff" aria-hidden="true"></i></div>
      <span style="font-size:15px;font-weight:500;flex:1;">Open Claude</span>
      <button class="ibtn" aria-label="收起侧边栏" style="width:28px;height:28px;"><i class="ti ti-layout-sidebar-left-collapse" style="font-size:18px" aria-hidden="true"></i></button>
    </div>
    <button class="newchat" id="newchat"><i class="ti ti-pencil-plus" style="font-size:16px" aria-hidden="true"></i>新对话</button>

    <div class="snav">
      <button class="navgroup" data-group="set"><i class="ti ti-settings" style="font-size:16px" aria-hidden="true"></i><span>设置</span><i class="ti ti-chevron-down chev" aria-hidden="true"></i></button>
      <div class="navsub" id="grp-set">
        <button class="subitem" data-panel="datasource"><i class="ti ti-database" aria-hidden="true"></i>数据源</button>
        <button class="subitem" data-panel="knowledge"><i class="ti ti-books" aria-hidden="true"></i>知识库</button>
        <button class="subitem" data-panel="ontology"><i class="ti ti-sitemap" aria-hidden="true"></i>本体</button>
        <button class="subitem" data-panel="modelparams"><i class="ti ti-adjustments" aria-hidden="true"></i>模型参数</button>
        <button class="subitem" data-panel="memory"><i class="ti ti-brain" aria-hidden="true"></i>记忆管理</button>
        <button class="subitem" data-panel="roles"><i class="ti ti-user-cog" aria-hidden="true"></i>角色管理</button>
        <button class="subitem" data-panel="prompts"><i class="ti ti-message-code" aria-hidden="true"></i>提示词管理</button>
      </div>

      <button class="navgroup" data-group="log"><i class="ti ti-list-details" style="font-size:16px" aria-hidden="true"></i><span>日志</span><i class="ti ti-chevron-down chev" aria-hidden="true"></i></button>
      <div class="navsub" id="grp-log">
        <button class="subitem" data-panel="log-ontology"><i class="ti ti-sitemap" aria-hidden="true"></i>本体日志</button>
        <button class="subitem" data-panel="log-llm"><i class="ti ti-robot" aria-hidden="true"></i>大模型日志</button>
        <button class="subitem" data-panel="log-tool"><i class="ti ti-tool" aria-hidden="true"></i>工具日志</button>
      </div>

      <div class="seclabel">会话</div>
      <button class="citem on">当前会话</button>
    </div>

    <div class="userrow">
      <div class="uav">OC</div>
      <div style="flex:1;min-width:0;">
        <div id="side-cwd" style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">对话助手</div>
        <div id="side-profile" style="font-size:11px;color:var(--color-text-tertiary);">profile: default</div>
      </div>
      <i class="ti ti-dots" style="font-size:16px;color:var(--color-text-tertiary)" aria-hidden="true"></i>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <button class="modelpill" id="modelpill">连接中… <i class="ti ti-chevron-down" style="font-size:15px;color:var(--color-text-secondary)" aria-hidden="true"></i></button>
      <div style="margin-left:auto;display:flex;gap:2px;">
        <button class="ibtn" aria-label="更多"><i class="ti ti-dots" style="font-size:18px" aria-hidden="true"></i></button>
      </div>
    </div>

    <div class="thread" id="thread">
      <div class="tinner" id="tinner">
        <div class="empty" id="empty">
          <i class="ti ti-sparkles" style="font-size:34px;color:var(--color-border-info)"></i>
          <div style="font-size:15px;color:var(--color-text-secondary)">Open Claude 对话助手</div>
          <div style="font-size:13px;">在这里和模型自由对话，支持多家模型切换。<br/>试试：「帮我把这段话润色得更专业一些」</div>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="cinner">
        <div class="inputbox">
          <button class="ibtn" aria-label="添加附件" style="width:30px;height:30px;flex-shrink:0;"><i class="ti ti-plus" style="font-size:19px" aria-hidden="true"></i></button>
          <input id="composer-input" type="text" placeholder="给对话助手发送消息…" style="flex:1;border:none;background:transparent;padding:0;height:auto;font-size:14px;color:var(--color-text-primary);outline:none;" />
          <button class="send" id="send-btn" aria-label="发送"><i class="ti ti-arrow-up" style="font-size:18px" aria-hidden="true"></i></button>
        </div>
        <div class="disc" id="disc">这是纯对话助手，不会读写本地文件或执行命令。请核实重要信息。</div>
      </div>
    </div>
  </div>
</div>

<div class="modal-mask" id="modal-mask">
  <div class="modal" id="modal">
    <div class="mhead">
      <div class="micon"><i class="ti ti-settings" id="modal-icon" style="font-size:19px;color:var(--color-text-secondary)" aria-hidden="true"></i></div>
      <div style="flex:1;min-width:0;">
        <h3 id="modal-title">面板</h3>
        <div class="mcat" id="modal-cat">设置</div>
      </div>
    </div>
    <div class="mbody" id="modal-body"></div>
    <div class="mnote" id="modal-note">该面板为前端占位，功能正在开发中（等待后端接入）。</div>
    <button class="mclose" id="modal-close"><i class="ti ti-x" style="font-size:15px" aria-hidden="true"></i>关闭</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const tinner = $('tinner');
const thread = $('thread');
const input = $('composer-input');
const sendBtn = $('send-btn');
let META = null, busy = false;

function el(tag, cls, txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
function scrollDown(){ thread.scrollTop = thread.scrollHeight; }
function clearEmpty(){ const e=$('empty'); if(e) e.remove(); }

/* ---- meta (model + profile) ---- */
async function loadMeta(){
  try{
    META = await (await fetch('/api/meta')).json();
    $('modelpill').firstChild.nodeValue = META.model + ' ';
    $('side-profile').textContent = 'profile: ' + META.profile;
  }catch(e){ $('modelpill').firstChild.nodeValue = '未连接 '; }
}

/* ---- model switching (managed in the 模型参数 settings panel) ---- */
async function switchModel(id){
  try{
    await fetch('/api/model',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:id})});
  }catch(e){}
  if(META) META.model=id;
  $('modelpill').firstChild.nodeValue=id+' ';
}
function renderModelList(container){
  container.innerHTML='';
  (META?.models||[]).forEach(m=>{
    const cur = m.id===META?.model;
    const b=el('button','modelopt'+(cur?' on':''));
    b.innerHTML='<i class="ti ti-'+(cur?'circle-check-filled':'circle')+'" aria-hidden="true"></i>'
      +'<span>'+m.label+'</span><span class="mid">'+m.id+'</span>';
    b.onclick=async ()=>{ await switchModel(m.id); renderModelList(container); };
    container.appendChild(b);
  });
}
async function saveParams(patch){
  try{
    const r=await fetch('/api/params',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});
    const j=await r.json(); if(j && !j.error && META) META.params=j;
  }catch(e){}
}
function buildModelPanel(body){
  const p=(META&&META.params)||{};
  const def=p.default_max_tokens||16384;
  body.innerHTML=
    '<div style="margin-bottom:8px">选择对话使用的模型（切换立即生效）：</div>'
   +'<div id="model-list" class="modellist"></div>'
   +'<div class="phead">推理参数</div>'
   +'<div class="prow"><label>最大输出 token<span class="hint">留空＝使用默认 '+def+'</span></label>'
     +'<input id="p-maxtok" type="number" min="1" step="256" placeholder="'+def+'" value="'+(p.max_tokens!=null?p.max_tokens:'')+'"></div>'
   +'<div class="prow" id="p-temp-row"><label>温度 (temperature)<span class="hint">越高越发散，范围 0–2</span></label>'
     +'<div class="pinline"><input id="p-temp" type="range" min="0" max="2" step="0.1" value="'+(p.temperature!=null?p.temperature:1)+'">'
     +'<span id="p-temp-val">'+(p.temperature!=null?Number(p.temperature).toFixed(1):'默认')+'</span></div></div>'
   +'<div class="prow"><label>扩展思考 (thinking)<span class="hint">开启后温度由模型固定为 1</span></label>'
     +'<span class="sw"><input id="p-think" type="checkbox" '+(p.thinking?'checked':'')+'><span class="sl"></span></span></div>'
   +'<div class="prow" id="p-budget-row"><label>思考预算 token<span class="hint">思考开启时生效，≥1024</span></label>'
     +'<input id="p-budget" type="number" min="1024" step="512" value="'+(p.thinking_budget!=null?p.thinking_budget:8000)+'"></div>';
  renderModelList(body.querySelector('#model-list'));

  const maxtok=body.querySelector('#p-maxtok');
  const temp=body.querySelector('#p-temp'), tempVal=body.querySelector('#p-temp-val');
  const think=body.querySelector('#p-think'), budget=body.querySelector('#p-budget');
  function syncThinking(){
    const on=think.checked;
    body.querySelector('#p-temp-row').classList.toggle('disabled', on);
    body.querySelector('#p-budget-row').classList.toggle('disabled', !on);
  }
  syncThinking();
  maxtok.onchange=()=>saveParams({max_tokens: maxtok.value===''?null:Number(maxtok.value)});
  temp.oninput=()=>{ tempVal.textContent=Number(temp.value).toFixed(1); };
  temp.onchange=()=>saveParams({temperature:Number(temp.value)});
  think.onchange=()=>{ syncThinking(); saveParams({thinking: think.checked}); };
  budget.onchange=()=>saveParams({thinking_budget:Number(budget.value)});
}
/* ---- tiny safe markdown (escape first) ---- */
function esc(s){ return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function renderMarkdown(src){
  const blocks=[]; let s = src.replace(/```([\s\S]*?)```/g,(m,code)=>{ blocks.push(code.replace(/^[a-zA-Z0-9]*\n/,'')); return '␀'+(blocks.length-1)+'␀'; });
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,(m,c)=>'<code>'+c+'</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.split(/\n{2,}/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
  s = s.replace(/␀(\d+)␀/g,(m,i)=>'</p><pre><code>'+esc(blocks[+i])+'</code></pre><p>');
  return s;
}

/* ---- message rendering ---- */
function addAssistant(){
  clearEmpty();
  const wrap=el('div','amsg');
  const av=el('div','aav'); av.innerHTML='<i class="ti ti-sparkles" style="font-size:15px;color:#fff"></i>';
  const body=el('div'); body.style.cssText='flex:1;min-width:0;';
  const txt=el('div','atxt'); body.appendChild(txt);
  wrap.appendChild(av); wrap.appendChild(body); tinner.appendChild(wrap); scrollDown();
  return {body,txt,full:''};
}
function addUser(text){ clearEmpty(); tinner.appendChild(el('div','ubub',text)); scrollDown(); }
function handle(ctx,ev){
  if(ev.type==='text'){ ctx.full+=ev.text; ctx.txt.textContent=ctx.full; scrollDown(); }
  else if(ev.type==='error'){ ctx.body.appendChild(el('div','err-line','⚠ '+ev.error)); scrollDown(); }
  else if(ev.type==='done'){
    if(ctx.full){ ctx.txt.classList.add('rendered'); ctx.txt.innerHTML=renderMarkdown(ctx.full); }
    if(ev.model) $('modelpill').firstChild.nodeValue=ev.model+' ';
  }
}

/* ---- send (SSE over fetch stream) ---- */
async function send(){
  const text=input.value.trim();
  if(!text||busy)return;
  input.value=''; busy=true; sendBtn.disabled=true;
  addUser(text);
  const ctx=addAssistant();
  try{
    const resp=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    if(!resp.ok||!resp.body) throw new Error('HTTP '+resp.status);
    const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf='';
    while(true){
      const {value,done}=await reader.read(); if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const chunk=buf.slice(0,i); buf=buf.slice(i+2);
        const line=chunk.split('\n').find(l=>l.startsWith('data:'));
        if(!line)continue;
        try{ handle(ctx, JSON.parse(line.slice(5).trim())); }catch(e){}
      }
    }
  }catch(e){ ctx.body.appendChild(el('div','err-line','⚠ 连接错误: '+e.message)); }
  busy=false; sendBtn.disabled=false; input.focus();
}

async function newChat(){
  await fetch('/api/new',{method:'POST'});
  tinner.innerHTML='';
  const e=el('div','empty'); e.id='empty';
  e.innerHTML='<i class="ti ti-sparkles" style="font-size:34px;color:var(--color-border-info)"></i><div style="font-size:15px;color:var(--color-text-secondary)">新会话已开始</div>';
  tinner.appendChild(e);
}

  knowledge :{cat:'设置',icon:'books',title:'知识库',desc:'管理用于检索增强（RAG）的文档集合与索引：上传、分块、向量化与命中调试。'},
  ontology  :{cat:'设置',icon:'sitemap',title:'本体',desc:'维护领域本体 / 概念模型：实体、关系、属性与推理规则的定义和编辑。'},
  modelparams:{cat:'设置',icon:'adjustments',title:'模型参数',desc:'调整推理参数：温度、最大输出 token、思考预算、Top-P 等，并可按角色保存。'},
  memory    :{cat:'设置',icon:'brain',title:'记忆管理',desc:'查看与编辑长期记忆条目、记忆写入模式与清理 / 归档策略。'},
  roles     :{cat:'设置',icon:'user-cog',title:'角色管理',desc:'管理 Agent 角色 / 人设（profile）：系统提示、工具范围、权限与默认模型。'},
  prompts   :{cat:'设置',icon:'message-code',title:'提示词管理',desc:'维护系统提示词与可复用的提示词模板库，支持版本与变量。'},
  'log-ontology':{cat:'日志',icon:'sitemap',title:'本体日志',desc:'记录本体的变更历史与推理过程：谁在何时改动了哪些实体 / 关系 / 规则。'},
  'log-llm' :{cat:'日志',icon:'robot',title:'大模型日志',desc:'记录每次模型调用的请求 / 响应、token 用量、耗时与成本，便于审计与排错。'},
  'log-tool':{cat:'日志',icon:'tool',title:'工具日志',desc:'记录工具 / 子代理的调用入参、执行结果与错误，用于追踪 Agent 行为。'},
};
function openPanel(key){
  const p=PANELS[key]; if(!p) return;
  $('modal-title').textContent=p.title;
  $('modal-cat').textContent=p.cat;
  $('modal-icon').className='ti ti-'+p.icon;
  const body=$('modal-body'), note=$('modal-note');
  if(key==='modelparams'){
    // Functional panel: model selection + inference parameters live here.
    buildModelPanel(body);
    note.style.display='none';
  }else{
    body.textContent=p.desc;
    note.style.display='';
  }
  $('modal-mask').classList.add('show');
}
function closeModal(){ $('modal-mask').classList.remove('show'); }
document.querySelectorAll('.navgroup').forEach(g=>{
  g.onclick=()=>{
    const sub=$('grp-'+g.dataset.group);
    const open=sub.classList.toggle('open');
    g.classList.toggle('open',open);
  };
});
document.querySelectorAll('.subitem').forEach(b=>{ b.onclick=()=>openPanel(b.dataset.panel); });
$('modal-close').onclick=closeModal;
$('modal-mask').onclick=(e)=>{ if(e.target===$('modal-mask')) closeModal(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* ---- wire up ---- */
sendBtn.onclick=send;
input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); }});
$('newchat').onclick=newChat;
$('modelpill').onclick=(e)=>{ e.stopPropagation(); openPanel('modelparams'); };
loadMeta();
input.focus();
