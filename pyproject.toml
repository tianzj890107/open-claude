[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-claude"
version = "0.5.0"
description = "Open Claude - AI coding assistant"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.42.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.optional-dependencies]
# Needed only for non-Anthropic models (Qwen, GLM, Kimi, DeepSeek, OpenAI),
# which speak the OpenAI-compatible Chat Completions API.
openai = ["openai>=1.30.0"]

[tool.setuptools.packages.find]
include = ["open_claude*"]

[project.scripts]
open-claude = "open_claude.__main__:main"
